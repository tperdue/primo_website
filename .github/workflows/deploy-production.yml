name: Test and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primo-production
  cancel-in-progress: false

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  deploy:
    name: Deploy production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://primodemo.eastpointsoftware.net
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure deployment key
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          test -n "$PRODUCTION_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/primo_deploy"
          chmod 0600 "$HOME/.ssh/primo_deploy"

      - name: Deploy tested commit
        run: |
          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/primo_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" \
            primo@primodemo.eastpointsoftware.net \
            "deploy $GITHUB_SHA"
